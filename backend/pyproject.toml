[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dialog-scoring"
version = "0.1.0"
description = "DIALOG Scoring — сервис автоматических решений по заявкам на исламскую рассрочку"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery>=5.4",
    "redis>=5.2",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "anthropic>=0.40",
    "rapidfuzz>=3.10",
    "PyYAML>=6.0",
    "argon2-cffi>=23.1",
    "pydantic[email]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pytest-randomly>=3.15",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
