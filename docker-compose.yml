services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dialog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dialog}
      POSTGRES_DB: ${POSTGRES_DB:-dialog}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dialog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      # Явно "dev" — это compose для локальной разработки (T11: APP_ENV
      # по умолчанию в коде — production, самый строгий режим, и не должен
      # тихо унаследоваться из окружения хоста, где он мог быть выставлен
      # для чего-то другого).
      APP_ENV: dev
      # Secure-кука на http://localhost ведёт себя по-разному в браузерах
      # (Safari может не сохранить её вовсе) — в dev выключаем явно, как и
      # APP_ENV; в production сервис откажется стартовать со значением false
      # (app/startup_guard.py).
      COOKIE_SECURE: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://dialog:dialog@db:5432/dialog}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PARTNER_BASE_URL: ${PARTNER_BASE_URL:-http://fake_partner:8000}
      PARTNER_TOKEN: ${FAKE_PARTNER_TOKEN:-dev-token}
      STORAGE_DIR: /data/storage
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OCR_MODEL: ${OCR_MODEL:-claude-sonnet-5}
      # T16: fake (по умолчанию) | http — настоящие ФНС/ФССП, см.
      # app/sources/factory.py. Переключать явно через .env, не менять
      # дефолт здесь.
      EXTERNAL_SOURCES_MODE: ${EXTERNAL_SOURCES_MODE:-fake}
    volumes:
      - storage_data:/data/storage
      - ./config:/app/config:ro
      # T15: docs/demo_import/*.csv — tests/test_demo_import_fixtures.py читает
      # эти же файлы, что загружает оператор через экран «Импорт данных»,
      # чтобы docs/demo_import/expected.md не мог разойтись с реальным кодом.
      - ./docs:/app/docs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      fake_partner:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    environment:
      APP_ENV: dev
      COOKIE_SECURE: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://dialog:dialog@db:5432/dialog}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PARTNER_BASE_URL: ${PARTNER_BASE_URL:-http://fake_partner:8000}
      PARTNER_TOKEN: ${FAKE_PARTNER_TOKEN:-dev-token}
      STORAGE_DIR: /data/storage
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OCR_MODEL: ${OCR_MODEL:-claude-sonnet-5}
      OCR_PROVIDER_MODE: ${OCR_PROVIDER_MODE:-anthropic}
      OCR_FIXTURE_PATH: ${OCR_FIXTURE_PATH:-}
      REGISTRIES_DIR: /data/registries
      REGISTRIES_DOWNLOADER: ${REGISTRIES_DOWNLOADER:-local}
      MVD_REGISTRY_URL: ${MVD_REGISTRY_URL:-}
      ROSFINMON_REGISTRY_URL: ${ROSFINMON_REGISTRY_URL:-}
      EXTERNAL_SOURCES_MODE: ${EXTERNAL_SOURCES_MODE:-fake}
    volumes:
      - storage_data:/data/storage
      - ./config:/app/config:ro
      # Сюда оператор кладёт свежевыгруженные файлы реестров вручную/полуавтоматически
      # (docs/registries.md) — bind mount, а не именованный volume, чтобы к каталогу
      # был обычный файловый доступ (scp/rsync) с хоста.
      - ./data/registries:/data/registries:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      fake_partner:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info

  beat:
    build: ./backend
    environment:
      APP_ENV: dev
      COOKIE_SECURE: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://dialog:dialog@db:5432/dialog}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PARTNER_BASE_URL: ${PARTNER_BASE_URL:-http://fake_partner:8000}
      PARTNER_TOKEN: ${FAKE_PARTNER_TOKEN:-dev-token}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app beat --loglevel=info

  # Админка (T13) — Vite dev-server сам проксирует /api на api:8000 (см.
  # frontend/vite.config.ts) — браузер видит только этот один адрес,
  # межсайтовых запросов нет, кука работает без какой-либо настройки CORS.
  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

  # Заглушка системы заказчика для локальной разработки — их реальный API пока неизвестен.
  fake_partner:
    build: ./fake_partner
    environment:
      FAKE_PARTNER_TOKEN: ${FAKE_PARTNER_TOKEN:-dev-token}
    ports:
      - "8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  storage_data:
