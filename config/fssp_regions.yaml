# Коды региональных управлений ФССП для поиска по физлицам
# (is[region_id][0] в https://is-go.fssp.gov.ru/ajax_search) — T16, разведка.
#
# Источник: выпадающий список #region_id на https://fssp.gov.ru/iss/ip,
# снят целиком 2026-10-04 (все значения и подписи как на сайте, без правок).
# Это НЕ код ОКАТО/ГОСТ субъекта РФ и НЕ префикс серии паспорта (две первые
# цифры серии — код места ВЫДАЧИ паспорта, не места регистрации — ваше явное
# указание: для выбора региона ФССП эти цифры не используются вообще).
#
# Один код ФССП может покрывать несколько субъектов РФ одним территориальным
# управлением (например, 41 — Камчатский край И Чукотский АО сразу) — при
# сопоставлении "регион прописки -> код ФССП" это нужно учитывать отдельно,
# таблица ниже — только то, что реально отдаёт сайт, без подгонки.
#
# Региона нет или не удалось определить по адресу регистрации — оператор
# выбирает регион сам из этого списка (блок ФССП в карточке заявки), не
# подставляется никакое значение по умолчанию.

