# T15, ТЗ «Логирование под будущую модель»: параметры расчёта просрочки.
# Не про стадию А/Б (dev.yaml) — отдельный домен (взыскание/сервисинг),
# поэтому отдельный файл, а не раздел в dev.yaml (правило 2 CLAUDE.md: не
# хардкодить — но и не мешать в один файл несвязанные области).

# Льготный срок: сколько дней после due_date просрочка ещё не считается
# просрочкой вовсе. days_past_due = max(0, (as_of - due_date самого старого
# непогашенного взноса) - grace_days) — платёж на 3-й день при grace_days=5
# даёт days_past_due=0, не 3 (app/engine/delinquency.py).
grace_days: 5
