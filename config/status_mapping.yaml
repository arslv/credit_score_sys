# Соответствие наших исходов статусам в системе заказчика (ТЗ, «Интеграция» ->
# «Соответствие статусов»). Значения partner_status — из словаря заглушки fake_partner
# (new | on_call | on_review | rejected | manual_decision | approved); для реального
# партнёра словарь будет другим — меняется только здесь, не в коде.
#
# {reason_text} — человеко-читаемый комментарий, собранный из reason_notes ниже
# (app.integrations.status_mapping.build_operator_comment, T11): перечисляет ВСЕ
# сработавшие правила с фактическим значением и порогом, либо текст по коду
# операционного исхода (БКИ недоступно, скор ниже порога и т.п.). Служебный
# reason_code сюда никогда не подставляется напрямую — оператор не программист.

rejected_a:
  partner_status: rejected
  comment_template: "Отказ на стадии А. {reason_text}"

ocr_failed:
  partner_status: on_call
  comment_template: "Не удалось распознать фото паспорта — нужно перефотографировать или внести данные вручную при звонке."

to_operator:
  partner_status: on_call
  comment_template: "Передано оператору на звонок. {summary}"

stage_b_incomplete:
  partner_status: on_call
  comment_template: "Не хватает данных для стадии Б. Недостающие разделы анкеты: {summary}"

rejected_b:
  partner_status: rejected
  comment_template: "Отказ на стадии Б. {reason_text}"

gray_zone:
  partner_status: manual_decision
  comment_template: "Требуется решение оператора. {reason_text}"

approved:
  partner_status: approved
  comment_template: "Одобрено: сумма {approved_amount}, срок {approved_term} мес., тариф {offered_tariff}, первый взнос {required_down_pay}."

# Тексты оператору по коду причины (T09, расширено в T11) — build_operator_comment
# берёт шаблон по reason (или id, если reason не задан) сработавшего правила из
# hard_stops/stage_b_pre_bki/soft_rules (config/rulesets/dev.yaml) и подставляет
# {actual}/{expected}/{actual_pct}/{expected_pct} из этого правила; либо, для
# исходов без конкретного правила (БКИ/скор/лимиты), берёт текст по
# Decision.reason_code с контекстом, который передаёт вызывающий код (score,
# пороги, требуемый взнос и т.п.). Нет текста для кода — запасной вариант с
# названием правила и значениями (см. build_operator_comment), не голый код.
reason_notes:
  # --- стадия А: hard_stops -----------------------------------------------------
  SANCTIONS_HIT: "Совпадение по перечню Росфинмониторинга. Передать в комплаенс. Клиенту причину не сообщать."
  BLACKLISTED: "Клиент в чёрном списке."
  PASSPORT_INVALID: "Паспорт недействителен по данным МВД."
  AGE_BELOW_MIN: "Возраст {actual} лет меньше минимального {expected}."
  PASSPORT_FORMAT_INVALID: "Паспортные данные не проходят проверку формата."
  PASSPORT_EXPIRED: "Паспорт подлежит замене по возрасту — истёк срок действия."
  PASSPORT_ISSUE_DATE_INVALID: "Дата выдачи паспорта не может быть верной (раньше рождения или позже сегодняшнего дня)."
  PASSPORT_BLANK_YEAR_FUTURE: "Год бланка паспорта позже текущего года — серия недействительна."
  FSSP_CREDIT_DEBT: "Долг по исполнительному производству кредитного характера {actual} ₽ выше допустимых {expected} ₽."

  # --- стадия Б: до БКИ -----------------------------------------------------------
  GOODS_NOT_ALLOWED: "Категория товара не разрешена шариатом."
  DECLARED_PTI_TOO_HIGH: "Долговая нагрузка по заявленным клиентом обязательствам {actual_pct}% выше допустимых {expected_pct}%."

  # --- стадия Б: после БКИ, движок правил -----------------------------------------
  PTI_HIGH: "Долговая нагрузка {actual_pct}% при допустимых {expected_pct}%."
  fssp_minor: "Долг по мелким исполнительным производствам {actual} ₽ (диапазон для ручной проверки: {expected})."

  # --- стадия Б: лимиты сделки ------------------------------------------------------
  LIMITS_NOT_MET: "Сделка не проходит ни по одному доступному тарифу — сумма, срок или первый взнос вне допустимых значений."
  TERM_OUT_OF_RANGE: "Запрошенный срок рассрочки вне допустимого диапазона."
  UNKNOWN_TARIFF: "Запрошенный тариф не найден в конфиге — нужна ручная проверка."

  # --- стадия Б: согласие/БКИ как источник (не правило, а состояние) --------------
  BKI_CONSENT_MISSING_OR_EXPIRED: "Нет действующего согласия клиента на запрос кредитной истории."
  BKI_NOT_CONFIGURED: "БКИ не подключено, решение за оператором."
  BKI_CLIENT_UNKNOWN: "Не удалось однозначно определить клиента по данным заявки — нужна ручная проверка."
  BKI_SOURCE_UNAVAILABLE: "Бюро кредитных историй временно недоступно — попробуйте повторно позже."
  BKI_ERROR: "Ошибка при обращении в бюро кредитных историй — нужна ручная проверка."

  # --- стадия Б: скор/пороги --------------------------------------------------------
  SCORE_MISSING: "Бюро не вернуло скоринговый балл — нужна ручная проверка."
  SCORE_THRESHOLDS_DISABLED: "Пороги автоматического скоринга отключены в конфиге — решение за оператором."
  SCORE_BELOW_THRESHOLD: "Скоринговый балл {score} ниже порога автоотказа {auto_reject_below}."
  SCORE_GRAY_ZONE: "Скоринговый балл {score} между порогом автоотказа {auto_reject_below} и порогом автоодобрения {auto_approve_above}."
  RISK_TARIFF_DOWN_PAYMENT_REQUIRED: "Одобрение возможно при первом взносе от {required_down_pay} ₽ (сейчас {down_payment} ₽)."
