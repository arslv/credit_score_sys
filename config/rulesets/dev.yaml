# Начальный конфиг для разработки — по образцу из ТЗ, раздел «Конфиг правил и пороги».
# Пороги — стартовые допущения (см. там же, «Начальные значения»), уточняются после
# разбора исторических данных заказчика.
version: 1
comment: "Начальная версия для разработки (T06)"
effective_from: 2026-01-01

ocr:
  min_confidence_key_fields: 0.85 # серия, номер, ФИО, дата рождения

sources:
  rosfinmon:
    name_match_min_similarity: 0.7 # нечёткий поиск по перечням (pg_trgm)
  registries:
    max_staleness_days: 2 # алерт, если реестр МВД/Росфинмониторинга старше
  passport:
    # Справочник — config/reference/fms_unit.csv (hflabs/fms-unit, CC BY-SA 4.0,
    # см. docs/registries.md).
    department_code_check_enabled: true
    blank_year_max_issue_offset_years: 3 # выдача позже года бланка больше чем на N лет — флаг
  fssp:
    # Классификация типов исполнительных производств (T09) — стартовые формулировки,
    # правятся по живым данным. Порядок важен: первое совпавшее правило побеждает.
    classification:
      - category: noise
        match: ["гибдд", "адм. штраф", "административный штраф", "пдд"]
      - category: credit_debt
        match: ["кредит", "займ", "заём", "микрозайм", "банк"]

# Стадия А: только жёсткие стоп-факторы, без БКИ.
# ПОРЯДОК ПРАВИЛ ВАЖЕН: при одновременном совпадении нескольких стоп-факторов
# reason_code в решении берётся от ПЕРВОГО совпавшего по порядку в этом списке
# (app.engine.rules.StopOutcome.reason_code) — не по алфавиту и не по имени
# признака. Список отсортирован по тяжести: санкции -> чёрный список ->
# недействительный паспорт -> всё остальное. freeze (заморозка) от порядка НЕ
# зависит — срабатывает по любому совпавшему правилу с freeze: true, где бы оно
# ни стояло в списке (StopOutcome.freeze = any(...)).
hard_stops:
  - id: sanctions
    field: checks.rosfinmon.status
    op: eq
    value: hit
    reason: SANCTIONS_HIT
    freeze: true
  - id: blacklist
    field: checks.blacklist.status
    op: eq
    value: hit
    reason: BLACKLISTED
  - id: passport_invalid
    field: checks.mvd.status
    op: eq
    value: hit
    reason: PASSPORT_INVALID
  - id: age_min
    field: age
    op: lt
    value: 21
    reason: AGE_BELOW_MIN
  - id: passport_format_invalid
    field: passport_format_valid
    op: eq
    value: false
    reason: PASSPORT_FORMAT_INVALID
  - id: passport_expired
    field: passport_expired
    op: eq
    value: true
    reason: PASSPORT_EXPIRED
  - id: passport_issue_date_invalid
    field: passport_issue_date_invalid
    op: eq
    value: true
    reason: PASSPORT_ISSUE_DATE_INVALID
  - id: passport_blank_year_future
    field: passport_blank_year_future
    op: eq
    value: true
    reason: PASSPORT_BLANK_YEAR_FUTURE
  - id: fssp_credit_debt
    field: features.fssp_credit_debt_amount
    op: gt
    value: 50000
    reason: FSSP_CREDIT_DEBT

# Стадия Б: до запроса БКИ
stage_b_pre_bki:
  - id: sharia_goods
    field: goods.sharia_allowed
    op: eq
    value: false
    reason: GOODS_NOT_ALLOWED
  - id: declared_pti_too_high
    # declared_pti_exceeds_max — булево, посчитанное в коде против limits.pti_max
    # (T11): порог не дублируется литералом в правиле, единый источник — limits.
    field: declared_pti_exceeds_max
    op: eq
    value: true
    reason: DECLARED_PTI_TOO_HIGH

# Стадия Б: после получения КИ
soft_rules:
  - id: pti_high
    field: features.pti
    op: gt
    value: 0.55
    action: manual_review
    reason: PTI_HIGH
  - id: fssp_minor
    field: features.fssp_total_amount
    op: between
    value: [5000, 50000]
    action: manual_review

limits:
  amount_min: 15000
  amount_max: 500000
  term_min: 3
  term_max: 24
  pti_max: 0.60
  # T22: pti_max — порог отказа и для ПДН по КИ, не только для заявленного
  # до БКИ (ТЗ: «ПДН, отказ — выше 60%»). Ручная проверка по КИ — pti_high.
  pti_max_applies_to_credit_history: true
  declared_income_cap: 80000 # потолок неподтверждённого дохода

tariffs:
  # ТЗ, «Тарифы». "Постоянному клиенту": взнос "уточняется" в самом ТЗ —
  # до уточнения используем 0, как у "Базового", и требуем is_repeat.
  # markup_pct (T21) — наценка, доля от суммы рассрочки: ЗАПАСНОЙ расчёт
  # платежа по рассрочке для ПДН, когда заказчик не прислал
  # deal.monthly_payment. ПОКА 0 — реальные наценки нужно получить у
  # заказчика (ТЗ, открытый вопрос «размер наценки по каждому тарифу»).
  standard: # Базовый
    down_payment_min_pct: 0.0
    markup_pct: 0.0
  advantageous: # Выгодный
    down_payment_min_pct: 0.20
    markup_pct: 0.0
  repeat_client: # Постоянному клиенту — взнос "уточняется" (ТЗ), см. docs/spec.md
    down_payment_min_pct: 0.0
    requires_repeat_client: true
    markup_pct: 0.0

stage_b_completeness:
  # Верхнеуровневые секции анкеты (ТЗ, «Анкета»), без которых дешёвые проверки
  # стадии Б не запускаются. "guarantor"/"family"/"contact" не обязательны.
  # T18: "address" убран — в новой схеме вебхука POST /review отдельной секции
  # адреса нет (ваше указание «формат определяем мы»), адрес заявителя уже
  # есть из OCR (registration_address, стадия А); для поручителя адрес по-
  # прежнему приходит внутри guarantor, если поручитель используется.
  required_sections: [deal, employment, income]

bki:
  cache_days: 30
  on_unavailable: manual_review
  consent_max_age_days: 30 # ТЗ, «Согласия»: согласие на КИ ограничено по сроку
  in_flight_timeout_minutes: 10 # T11: зависший запрос (воркер упал) считается сбойным после этого срока

score_thresholds:
  enabled: true
  auto_approve_above: 700
  auto_reject_below: 450

matrix:
  - when: {amount_gt: 200000}
    override: {auto_approve_above: 780}
  - when: {goods_liquidity: low}
    override: {auto_approve_above: 760, require_down_payment: 0.20}
  - when: {is_repeat: true, prior_defaults: 0}
    override: {auto_approve_above: 650}

antifraud:
  max_applications_per_phone_30d: 3
  duplicate_window_days: 30

# T16, ваше явное указание: без проверки ФССП (заявитель и поручитель, если
# есть) approved невозможен — максимум gray_zone, причина FSSP_NOT_CHECKED.
fssp_required_for_approval: true

# T17, часть 5 (ваше явное указание): порог заголовка-вывода «Недоступность
# источников» на Аналитике — не решение по заявке, только формулировка.
dashboard:
  source_unavailable_warn_threshold: 0.05

# T23: рейтинг клиента — экспертная скоркарта заказчика («Рейтинг клиента.docx»).
# Баллы по критериям складываются. ПОКА ИНФОРМАЦИОННО (affects_decision: false):
# показывается в карточке заявки, на решение не влияет — пороги суммы (с какой
# одобрять/отказывать) заказчик ещё не назвал. Всё, что в документе было
# неоднозначно, — в not_yet_counted и в списке вопросов (docs/reports/T23.md).
client_rating:
  affects_decision: false
  age_bands:
    - {min: 0, max: 21, points: -500, points_with_guarantor: 0, requires_guarantor: true}
    - {min: 22, max: 24, points: -20}
    - {min: 25, max: 27, points: 0}
    - {min: 28, max: 30, points: 30}
    - {min: 31, max: 34, points: 60}
    - {min: 35, max: 39, points: 90}
    - {min: 40, max: 55, points: 100}
    - {min: 56, max: 65, points: 60}
    # «66–70 (0), только с поручителем»; «от 66 и старше» — автозапрос поручителя.
    # Старше 70 в документе нет — пока как 66–70 (вопрос заказчику).
    - {min: 66, max: 120, points: 0, requires_guarantor: true}
  # Кем приходится контактное лицо (поле contacts[].relation в /review).
  contact_relations:
    parent: родители
    sibling: брат/сестра
    relative: другие родственники
    spouse: супруг(а)
    friend: друзья
    colleague: коллеги
    other: другое окружение
  # Первое подошедшее правило по порядку.
  contact_rules:
    - id: parents_and_sibling
      label: есть номера родителей и брата/сестры
      points: 100
      has_all: [parent, sibling]
    - id: relatives_40_plus
      label: от 40 лет, дал номера родственников
      points: 100
      age_min: 40
      has_any: [parent, sibling, relative, spouse]
    - id: only_friends
      label: только друзья и окружение
      points: -150
      only: [friend, colleague, other]
    - id: under_30_no_parents
      label: до 30 лет, нет номеров родителей
      points: -150
      age_max: 29
      lacks: [parent]
    - id: from_30_to_40_no_parents
      label: 30–40 лет, без номеров родителей
      points: 0
      age_min: 30
      age_max: 40
      lacks: [parent]
  # Первая подошедшая по порядку; ключевые слова — начало слова в месте
  # работы/должности из анкеты (employment.employer / employment.position).
  work_categories:
    - id: government
      label: госработа
      points: 300
      # «МВД» в анкете часто как ОМВД/УМВД (отдел/управление) — та же категория.
      keywords: [врач, учител, мвд, омвд, умвд, мчс, администрац, депутат]
    - id: official_large
      label: официально в крупной компании (Газпром, Сбер, РЖД)
      points: 230
      keywords: [газпром, сбер, ржд]
    - id: large_local
      label: крупная местная организация
      points: 150
      keywords: [киргу, 05 ру, реал 2]
    - id: benefits
      label: пособия, пенсия, кассир
      points: 120
      keywords: [пособи, пенси, кассир]
      employment_types: [pensioner]
    - id: entrepreneur_retail
      label: ИП, продавец-консультант, повар/кондитер
      points: 100
      keywords: [ип, индивидуальный предприниматель, продав, повар, кондитер]
      employment_types: [individual_entrepreneur]
    - id: services
      label: салон красоты, дальнобойщик, бариста, официант
      points: 50
      keywords: [салон красоты, дальнобо, барист, официант]
    - id: trades
      label: строитель, таксист, юрист, адвокат, швея, торговый представитель
      points: 20
      keywords: [строител, такси, юрист, адвокат, швея, торговый представител]
    - id: zero
      label: курьер, охранник (не гос), риелтор, заправщик
      points: 0
      keywords: [курьер, охран, риелтор, риэлтор, заправ]
  # Первая подошедшая по порядку; место — целым словом/фразой в адресе прописки.
  # Отказные сёла — первыми: совпадение там важнее района.
  registration_groups:
    - label: отказная прописка
      refused: true
      places: [маали, хаджалмахи, куппа, ташкапур]
    - label: Махачкала, Каспийск, Карабудахкентский р-н, Дербент, Избербаш
      points: 100
      places: [махачкала, каспийск, карабудахкентский, дербент, избербаш]
    - label: города и районы второй группы
      points: 80
      places: [дагестанские огни, даг огни, хасавюрт, кизляр, буйнакск, кизилюрт, дербентский, каякентский,
               кизилюртовский, кизлярский, новолакский, сергокалинский, хасавюртовский]
    - label: районы третьей группы
      points: 60
      places: [дахадаевский, казбековский, кайтагский, кумторкалинский, хивский]
    - label: районы четвёртой группы
      points: 50
      places: [бабаюртовский, магарамкентский, сулейман стальский, табасаранский, тарумовский, южно сухокумск]
    - label: районы без баллов
      points: 0
      places: [акушинский, левашинский, ногайский, унцукульский]
    - label: в основном с поручителем
      points: -50
      places: [ахтынский, докузпаринский, курахский]
    - label: только с поручителем
      points: -100
      requires_guarantor: true
      places: [гергебельский, гумбетовский, гунибский, лакский]
    - label: только с поручителем
      points: -200
      requires_guarantor: true
      places: [агульский, ахвахский, бежтинский, ботлихский, кулинский, тляратинский, рутульский, хунзахский,
               цумадинский, цунтинский, чародинский, шамильский]
  # «На телефоны с СФ 50+, где возраст клиента 24 или меньше» — СФ трактуем как
  # сумму финансирования (цена минус взнос), 50 000 ₽ (вопрос заказчику).
  guarantor_product_rules:
    - label: телефон от 50 000 ₽ в рассрочку, клиенту 24 года или меньше
      goods_category_codes: [phones]
      financed_amount_min: 50000
      age_max: 24
  not_yet_counted:
    - платёжеспособность (остаток дохода после платежа)
    - ПКИ, БО, наличие кредитов
    - место работы супруги
