# T15: платежи привязываются к договору по external_number (contracts.yaml) —
# это, в отличие от привязки договор-заявка, обычно однозначный номер в самой
# учётной системе, без эвристик.

columns:
  external_number: "Номер договора"
  paid_at: "Дата платежа"
  amount: "Сумма"
  # Колонка может отсутствовать в выгрузке вовсе — тогда все платежи считаются
  # "regular" (kind_map ниже не применяется, см. app/engine/imports.py).
  kind: "Тип платежа"

# Значения колонки "kind" -> наш payments.kind (ваше явное указание: неустойка
# по мурабахе — не доход и не погашение графика, учитывается отдельно и не
# засчитывается в разнесение по графику, app/engine/delinquency.py).
kind_map:
  "Платёж по графику": regular
  "Досрочное погашение": regular
  "Неустойка": penalty
  "Пеня": penalty
  "Сторно": reversal
  "Возврат": reversal

date_format: "%d.%m.%Y"
