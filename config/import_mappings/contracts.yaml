# T15: формат выгрузки договоров из учётной системы заказчика неизвестен
# заранее (ТЗ) — соответствие "наше поле -> колонка в CSV" только здесь, код
# импортёра (app/engine/imports.py) ничего не знает о реальных названиях
# колонок. Поменяется формат выгрузки — поменяется этот файл, не код.

columns:
  external_number: "Номер договора"
  principal: "Сумма товара"
  markup: "Наценка"
  total_amount: "Итого к оплате"
  down_payment: "Первый взнос"
  term_months: "Срок мес"
  issued_at: "Дата выдачи"
  status: "Статус"
  # Закрытие — не всегда погашение (ваше замечание): товар могли изъять или
  # долг списать, это дефолт, не хороший исход. Дата и причина закрытия —
  # отдельные колонки; трактовка причины — closure_outcome_map ниже, не код.
  closed_at: "Дата закрытия"
  closure_reason: "Причина закрытия"
  # Однозначный идентификатор нашей заявки в этой же строке, если выгрузка его
  # содержит — ЕДИНСТВЕННЫЙ способ автоматической привязки (ваше явное
  # указание: по телефону/ФИО — только кандидат, не автоматика).
  match_external_id: "Номер заявки"
  # Если match_external_id нет/не нашёлся — используются как кандидаты
  # (app/models/imports.ContractLinkCandidate), требуют подтверждения человека.
  applicant_name: "ФИО"
  applicant_phone: "Телефон"

status_map:
  "Действует": active
  "Закрыт": closed
  "Дефолт": defaulted
  "Изъятие": repossessed

# Трактовка причины закрытия (contracts.closure_outcome, ваше замечание):
# "погашен" -> хороший исход (таргет 0, даже если окно формально не истекло);
# "товар изъят"/"списан" -> плохой исход (таргет 1), даже если 60+ дней
# просрочки по графику формально не набралось. Причина, которой нет в этом
# списке, но closed_at заполнен — closure_outcome="unknown", таргет NULL, не 0
# (app/engine/imports.py; target_bad_60_6/90_12 используют именно это поле,
# не одно только closed_at).
closure_outcome_map:
  "Погашен": good
  "Погашен досрочно": good
  "Товар изъят": bad
  "Списан": bad

date_format: "%d.%m.%Y"
